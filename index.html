<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin-top:10px;
}

canvas{
    background:#222;
    border:3px solid #00ff00;
    max-width:95vw;
    max-height:95vw;
    touch-action:none;
}

button{
    cursor:pointer;
}

#startBtn{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:10px;
    margin:10px;
}

.controls{
    margin-top:15px;
}

.controls button{
    width:70px;
    height:70px;
    font-size:28px;
    margin:5px;
    border:none;
    border-radius:12px;
}
</style>
</head>

<body>

<h1>🐍 Snake Game</h1>

<p>ניקוד: <span id="score">0</span></p>

<button id="startBtn">▶️ התחל משחק</button>

<br>

<canvas id="game" width="400" height="400"></canvas>

<div class="controls">
    <div>
        <button onclick="changeDir('up')">⬆️</button>
    </div>
    <div>
        <button onclick="changeDir('left')">⬅️</button>
        <button onclick="changeDir('down')">⬇️</button>
        <button onclick="changeDir('right')">➡️</button>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 20;

let snake = [{x:10,y:10}];

let food = {
    x: Math.floor(Math.random()*20),
    y: Math.floor(Math.random()*20)
};

let dx = 1;
let dy = 0;
let score = 0;
let gameLoop = null;

function changeDir(dir){
    if(dir === "up" && dy === 0){ dx = 0; dy = -1; }
    if(dir === "down" && dy === 0){ dx = 0; dy = 1; }
    if(dir === "left" && dx === 0){ dx = -1; dy = 0; }
    if(dir === "right" && dx === 0){ dx = 1; dy = 0; }
}

document.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowUp") changeDir("up");
    if(e.key === "ArrowDown") changeDir("down");
    if(e.key === "ArrowLeft") changeDir("left");
    if(e.key === "ArrowRight") changeDir("right");
});

function draw(){

    let head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    if(head.x < 0 || head.y < 0 || head.x >= 20 || head.y >= 20){
        gameOver();
        return;
    }

    for(let part of snake){
        if(head.x === part.x && head.y === part.y){
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y){
        score++;
        document.getElementById("score").innerText = score;

        food = {
            x: Math.floor(Math.random()*20),
            y: Math.floor(Math.random()*20)
        };
    } else {
        snake.pop();
    }

    ctx.clearRect(0,0,400,400);

    ctx.fillStyle = "red";
    ctx.fillRect(food.x*grid, food.y*grid, grid, grid);

    ctx.fillStyle = "lime";
    snake.forEach(p=>{
        ctx.fillRect(p.x*grid, p.y*grid, grid-2, grid-2);
    });
}

function gameOver(){
    clearInterval(gameLoop);
    alert("הפסדת! ניקוד: " + score);
    location.reload();
}

document.getElementById("startBtn").addEventListener("click", ()=>{
    if(!gameLoop){
        gameLoop = setInterval(draw,120);
        document.getElementById("startBtn").style.display = "none";
    }
});
</script>

</body>
</html>
